[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogiq"
version = "0.1.0"
description = "AI copilot for e-commerce marketplaces: listing generation, visual search, review Q&A and catalog quality checks."
readme = "README.md"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "\\.venv|notebooks"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/catalogiq", "api"]
branch = false

[tool.coverage.report]
# CI fails below this. Measured on a clean checkout (no data, no models, no network): see docs/testing.md.
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
