name: CI

# Lint, format check and tests on every push and pull request.
# The tests use fixtures and mocked models: nothing is downloaded except Python packages
# (no datasets, no model weights, no Ollama).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # CPU-only PyTorch: the default Linux wheel pulls about 2 GB of CUDA libraries.
      # The local version tag (+cpu) sorts above the plain PyPI version, so this index wins.
      - name: Install CPU PyTorch
        run: >
          python -m pip install torch==2.14.1 torchvision==0.29.1
          --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install -e . --no-deps

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Tests with coverage
        run: >
          python -m pytest
          --cov=src/catalogiq --cov=api
          --cov-report=term-missing:skip-covered --cov-report=xml
          --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
