# CatalogIQ base configuration. Paths are relative to the project root.
project:
  name: catalogiq
  seed: 42

paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  models: models
  reports_figures: reports/figures
  docs: docs
  mlflow_tracking_dir: mlruns

data:
  fashion:
    kaggle_slug: paramaggarwal/fashion-product-images-small
    raw_dir: data/raw/fashion
    styles_csv: data/raw/fashion/styles.csv
    images_dir: data/raw/fashion/images
    colour_map: configs/colour_map.yaml
    audit_parquet: data/interim/fashion_audit.parquet
    audit_summary_json: reports/fashion_audit.json
    clean_parquet: data/processed/fashion_clean.parquet
    splits_dir: data/processed
    taxonomy: [masterCategory, subCategory, articleType, baseColour, gender, season, usage]
  reviews:
    hf_dataset: McAuley-Lab/Amazon-Reviews-2023
    category: Amazon_Fashion
    reviews_file: hf://datasets/McAuley-Lab/Amazon-Reviews-2023/raw/review_categories/Amazon_Fashion.jsonl
    meta_file: hf://datasets/McAuley-Lab/Amazon-Reviews-2023/raw/meta_categories/meta_Amazon_Fashion.jsonl
    raw_dir: data/raw/reviews
    counts_json: data/interim/review_counts.json
    reviews_parquet: data/processed/amazon_reviews.parquet
    meta_parquet: data/processed/amazon_items.parquet
    max_processed_mb: 300
    n_items: 800
    min_reviews_per_item: 20
    max_reviews_per_item: 300
    min_review_chars: 30

fashion_cleaning:
  # Perceptual-hash Hamming distance at or below which two images are "the same photo".
  phash_hamming_threshold: 1
  min_image_side: 20
  split_fractions: {train: 0.70, val: 0.15, test: 0.15}
  split_folds: 20
  # Per target: classes with fewer rows than min_count are dropped or merged into "Other".
  rare:
    masterCategory: {min_count: 50, policy: drop}
    subCategory: {min_count: 100, policy: other}
    articleType: {min_count: 100, policy: drop}
    baseColour: {min_count: 100, policy: other}
    gender: {min_count: 100, policy: drop}
    season: {min_count: 100, policy: other}
    usage: {min_count: 100, policy: other}

listing_quality:
  # Weighted-rating prior strength: items with fewer ratings are pulled toward the catalog mean.
  prior_strength: 50
  exemplar_min_ratings: 50
  exemplar_min_score: 0.85
  exemplar_min_title_chars: 20
  exemplar_min_features: 3

images:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

split:
  test_size: 0.15
  val_size: 0.15

classifier:
  targets: [masterCategory, subCategory, articleType, baseColour, gender, season, usage]
  backbone: resnet18
  batch_size: 64
  epochs: 5
  learning_rate: 0.001

models:
  clip:
    name: ViT-B-32
    pretrained: laion2b_s34b_b79k
  text_embedder: sentence-transformers/all-MiniLM-L6-v2
  llm:
    provider: ollama
    model: llama3.2:3b
    fallback_model: qwen2.5:3b
    host: http://localhost:11434
    temperature: 0.2
    timeout_s: 120

retrieval:
  top_k: 5
  vector_store_dir: data/processed/chroma
  faiss_index_path: models/faiss_index.bin
  duplicate_similarity_threshold: 0.95

quality:
  blur_threshold: 100.0
  brightness_min: 40
  brightness_max: 220

logging:
  level: INFO

mlflow:
  experiment_name: catalogiq
