# Small retrieval test set for Phase 4. A listing is RELEVANT when its title + features text matches `relevant`
# (case-insensitive regex). Relevance is therefore objective and was fixed before any ranker was run.
#   lexical  : the query uses rare exact words/numbers that a keyword ranker should catch
#   semantic : the query paraphrases (words differ from the listing text) so a meaning-based ranker should win
#   mixed    : both kinds of signal
queries:
  # --- lexical -------------------------------------------------------------------------------
  - {id: L01, kind: lexical, query: "UPF 50+ sun protection long sleeve shirt", relevant: 'upf'}
  - {id: L02, kind: lexical, query: "925 sterling silver earrings", relevant: '925|sterling'}
  - {id: L03, kind: lexical, query: "boxer brief 6-pack", relevant: 'boxer'}
  - {id: L04, kind: lexical, query: "lambskin leather gloves touchscreen", relevant: 'glove'}
  - {id: L05, kind: lexical, query: "wayfarer sunglasses matte black", relevant: 'wayfarer'}
  - {id: L06, kind: lexical, query: "compression socks 15-20mmHg", relevant: 'compression'}
  - {id: L07, kind: lexical, query: "reading glasses spring hinge +2.00", relevant: 'reading glass'}
  - {id: L08, kind: lexical, query: "Casio digital watch", relevant: 'casio'}
  - {id: L09, kind: lexical, query: "316L surgical steel piercing", relevant: '316l|surgical'}
  - {id: L10, kind: lexical, query: "Russell Athletic Dri-Power", relevant: 'russell|dri-power'}
  # --- semantic ------------------------------------------------------------------------------
